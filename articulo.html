<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actualidad jurídica | Vanessa Puetate</title>
<meta name="description" content="Artículo de actualidad jurídica de Vanessa Puetate.">
<link rel="icon" href="favicon-32.png">
<style>
:root{--navy:#0B2E55;--navy2:#173F6E;--blue:#2F6FA8;--gold:#C79A3B;--gold-deep:#9B6B1D;--ice:#F2F7FB;--line:#D9E5EF;--ink:#1E2A36;--muted:#617487;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);line-height:1.6;background:#fff}
a{text-decoration:none;color:inherit}.container{width:min(1050px,92%);margin:auto}
header{border-bottom:1px solid rgba(199,154,59,.26);background:#fff;position:sticky;top:0;z-index:10}
.head{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.head img{width:62px;height:62px;object-fit:contain}.back{color:var(--navy);font-weight:800}
.hero{padding:64px 0 48px;background:linear-gradient(180deg,#fff,#F6FAFD)}
.eyebrow{color:var(--gold-deep);font-size:.76rem;font-weight:900;letter-spacing:.15em;margin:0 0 10px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--navy);line-height:1.15}
h1{font-size:clamp(2.3rem,6vw,4rem);margin:0 0 14px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:50px 0 80px}
.card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(11,46,85,.055)}
.media{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--blue));display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-size:2.3rem;font-weight:700}
.media img{width:100%;height:100%;object-fit:cover}.body{padding:22px;display:flex;flex-direction:column;flex:1}.body p{color:var(--muted)}
.meta{display:flex;gap:9px;flex-wrap:wrap;font-size:.8rem;color:#6A8091;margin-bottom:10px}.tag{background:var(--ice);color:var(--navy);padding:4px 9px;border-radius:999px;font-weight:800}
.read{color:var(--blue);font-weight:800;margin-top:auto}.empty{grid-column:1/-1;padding:28px;border:1px dashed #B7C9D8;border-radius:18px;color:var(--muted)}
.article{width:min(820px,92%);margin:0 auto;padding:58px 0 90px}.article .cover{border-radius:24px;overflow:hidden;margin:25px 0}.article .cover img{width:100%;max-height:470px;object-fit:cover}
.article-content{font-size:1.05rem;color:#3E5264;white-space:pre-line}.source{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
footer{background:#081E35;color:#C8D8E5;padding:35px 0;text-align:center}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container head">
<a href="index.html"><img src="logo-vp.png" alt="Vanessa Puetate"></a>
<a class="back" href="actualidad.html">← Actualidad jurídica</a>
</div></header>
<main id="articulo" class="article"><p class="muted">Cargando publicación…</p></main>
<footer>© <span id="year"></span> Vanessa Puetate · La información es general y no sustituye asesoría jurídica individual.</footer>
<script>
const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fecha=f=>f?new Intl.DateTimeFormat('es-CO',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(f+'T12:00:00')):'';
async function cargar(){
 const el=document.getElementById('articulo');
 const id=new URLSearchParams(location.search).get('id');
 try{
  const r=await fetch('data/actualidad.json?v='+Date.now(),{cache:'no-store'});
  const d=await r.json();
  const x=(d.publicaciones||[]).find(p=>p.id===id && p.publicado!==false);
  if(!x){el.innerHTML='<h1>Publicación no encontrada</h1><p class="muted">La publicación no existe o ya no está disponible.</p>';return;}
  document.title=x.titulo+' | Vanessa Puetate';
  el.innerHTML=`<div class="meta"><span class="tag">${esc(x.categoria||'General')}</span><span>${fecha(x.fecha)}</span></div>
  <h1>${esc(x.titulo)}</h1>
  <p class="muted">${esc(x.resumen||'')}</p>
  ${x.imagen?`<div class="cover"><img src="${esc(x.imagen)}" alt=""></div>`:''}
  <div class="article-content">${esc(x.contenido||'')}</div>
  ${x.fuente?`<div class="source"><strong>Fuente o referencia:</strong> <a class="read" href="${esc(x.fuente)}" target="_blank" rel="noopener">Consultar fuente</a></div>`:''}`;
 }catch(e){el.innerHTML='<h1>No fue posible cargar la publicación</h1>';}
}
document.getElementById('year').textContent=new Date().getFullYear(); cargar();
</script>
</body></html>
